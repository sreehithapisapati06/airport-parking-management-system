<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smart Airport Parking Finder — Mock Payment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
  :root{--primary:#0b63d6;--accent:#06a77d;--muted:#667085;--card:#ffffff;}
  *{box-sizing:border-box}
  body{font-family:"Poppins",sans-serif;margin:0;background:linear-gradient(180deg,#f4f7fb,#eef4ff);color:#0f1724}
  header{background:linear-gradient(90deg,var(--primary),#0077ff);color:white;padding:18px}
  header h1{margin:0;font-size:20px}
  main{max-width:1150px;margin:18px auto;padding:14px}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:16px}
  .card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(11,99,214,0.06)}
  .small{font-size:13px;color:var(--muted)}
  select,input,button,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef;font-size:14px}
  .btn{background:var(--primary);color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:600}
  .map-open{background:linear-gradient(90deg,var(--accent),#06c08f);border:none;color:white;padding:8px;border-radius:8px;cursor:pointer}
  .zones{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .zone-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;border:1px solid #eef3ff}
  .chip{padding:6px 8px;border-radius:999px;background:#f1f7ff;color:var(--primary);font-weight:600}
  .live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:10px}
  .slot-card{padding:10px;border-radius:10px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #e6eefc;cursor:pointer;text-align:center}
  .slot-card.booked{background:linear-gradient(180deg,#fff6f6,#fff1f1);border:1px solid #fce7e7;color:#7f1d1d;cursor:not-allowed}
  .map-canvas{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:10px;background:linear-gradient(180deg,#ffffff,#f3f7ff);border-radius:10px}
  .map-spot{padding:10px;border-radius:6px;border:1px dashed #dbeafe;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
  .map-spot.free{background:#e6ffef;border-color:#b7ffd0}
  .map-spot.occupied{background:#fff0f0;border-color:#ffd6d6;color:#7f1d1d}
  .modal-back{position:fixed;inset:0;background:rgba(2,6,23,0.45);display:flex;align-items:center;justify-content:center;z-index:80}
  .modal{width:420px;background:white;border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(2,6,23,0.2)}
  .muted{color:var(--muted)}
  .toast{position:fixed;right:18px;bottom:18px;background:#111;color:white;padding:12px 14px;border-radius:10px;z-index:90}
  footer{max-width:1150px;margin:12px auto;padding:10px 18px;color:var(--muted);font-size:13px}
  @media (max-width:1000px){.layout{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <h1>Smart Airport Parking Finder</h1>
</header>

<main>
  <div class="layout">
    <!-- LEFT -->
    <div>
      <div class="card">
        <label class="small">Choose Airport</label>
        <select id="airportSelect" onchange="onAirportChange()"></select>
        <div style="height:10px"></div>
        <div style="display:flex;gap:10px;align-items:center;justify-content:space-between">
          <div>
            <div class="small">Currency</div>
            <div id="currencyBox" class="chip">—</div>
          </div>
          <div style="min-width:120px">
            <div class="small">Duration (hrs)</div>
            <input type="number" id="hours" min="1" value="2" />
          </div>
        </div>
        <div style="height:10px"></div>
        <button class="btn" onclick="refreshDashboard()">Refresh</button>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:700">Zones</div>
        <div class="zones" id="zonesList"></div>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:700">Reservations</div>
        <div id="reservationsList" style="margin-top:10px"></div>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:700">Transactions (mock)</div>
        <div id="txList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700" id="airportName">—</div>
            <div class="small muted" id="airportMeta">—</div>
          </div>
          <div class="small muted">Last update: <span id="lastUpdate">—</span></div>
        </div>

        <div style="margin-top:12px">
          <div style="font-weight:700">Live Slots</div>
          <div id="liveGrid" class="live-grid"></div>
        </div>
      </div>

      <div id="mapViewCard" class="card" style="display:none;margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700" id="mapTitle">Map</div>
            <div class="small muted" id="mapSubtitle">Interactive — click a free spot</div>
          </div>
          <button class="btn" onclick="closeMap()">Back</button>
        </div>
        <div style="margin-top:12px">
          <div id="mapCanvas" class="map-canvas"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>Prototype — Mock payments only. No real transactions.</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ------------------------
   Data & helpers
   ------------------------ */
const airports = {
  JFK:{code:"JFK",name:"JFK International (USA)",currency:{code:"USD",symbol:"$"}, rate:5},
  LHR:{code:"LHR",name:"London Heathrow (UK)",currency:{code:"GBP",symbol:"£"}, rate:4},
  DEL:{code:"DEL",name:"Delhi International (India)",currency:{code:"INR",symbol:"₹"}, rate:50},
  DXB:{code:"DXB",name:"Dubai International (UAE)",currency:{code:"AED",symbol:"د.إ"}, rate:20},
  NRT:{code:"NRT",name:"Tokyo Narita (Japan)",currency:{code:"JPY",symbol:"¥"}, rate:600}
};

function createInitialState(){
  const s={};
  Object.values(airports).forEach(a=>{
    const zones=[
      {id:a.code+"_A",name:"Terminal A",rows:4,cols:8},
      {id:a.code+"_B",name:"Terminal B",rows:4,cols:8},
      {id:a.code+"_ECO",name:"Economy Lot",rows:6,cols:10}
    ];
    s[a.code]={airport:a,zones:{}};
    zones.forEach(z=>{
      const spots={};
      let idx=1;
      for(let r=0;r<z.rows;r++){
        for(let c=0;c<z.cols;c++){
          const id = `${z.id}_S${String(idx).padStart(3,'0')}`;
          spots[id] = { id, name: `${z.name[0]}${r+1}-${c+1}`, status: Math.random()>0.7 ? 'occupied' : 'free', lastSeen: Date.now() };
          idx++;
        }
      }
      s[a.code].zones[z.id] = { meta: z, spots };
    });
  });
  return s;
}
let GLOBAL = JSON.parse(localStorage.getItem('parking_state_v1')) || createInitialState();
let selectedAirport = Object.keys(airports)[0];
let selectedZoneId = null;
let iotInterval = null;

function saveState(){ localStorage.setItem('parking_state_v1', JSON.stringify(GLOBAL)); }
function toast(msg, t=3000){ const el=document.createElement('div'); el.className='toast'; el.style.position='fixed'; el.style.right='18px'; el.style.bottom='18px'; el.style.background='#111'; el.style.color='white'; el.style.padding='10px 14px'; el.style.borderRadius='10px'; el.style.zIndex=999; el.innerText=msg; document.getElementById('toastRoot').appendChild(el); setTimeout(()=>el.remove(),t); }

/* ------------------------
   UI init & render
   ------------------------ */
function populateAirportSelect(){
  const sel = document.getElementById('airportSelect'); sel.innerHTML='';
  Object.values(airports).forEach(a=>{ const o=document.createElement('option'); o.value=a.code; o.textContent=a.name; sel.appendChild(o); });
  sel.value = selectedAirport;
  updateAirportInfo();
}
function updateAirportInfo(){
  const a = airports[selectedAirport];
  document.getElementById('currencyBox').textContent = `${a.currency.symbol} (${a.currency.code})`;
  document.getElementById('airportName').textContent = a.name;
  document.getElementById('airportMeta').textContent = a.code;
}
function renderZones(){
  const container = document.getElementById('zonesList'); container.innerHTML='';
  const zones = GLOBAL[selectedAirport].zones;
  Object.values(zones).forEach(z=>{
    const total = Object.keys(z.spots).length;
    const occ = Object.values(z.spots).filter(s=>s.status==='occupied').length;
    const free = total - occ;
    const row = document.createElement('div'); row.className='zone-row';
    row.innerHTML = `<div><strong>${z.meta.name}</strong><div class="small muted">${free} free • ${occ} occupied</div></div>`;
    const right = document.createElement('div'); right.style.display='flex'; right.style.gap='10px'; right.style.alignItems='center';
    const chip = document.createElement('div'); chip.className='chip'; chip.innerText = `${Math.round((occ/total)*100)}%`;
    const btn = document.createElement('button'); btn.className='map-open'; btn.innerText='Open Map';
    btn.onclick = ()=>openMap(z.meta.id);
    right.appendChild(chip); right.appendChild(btn);
    row.appendChild(right);
    container.appendChild(row);
  });
}
function renderLiveGrid(){
  const grid = document.getElementById('liveGrid'); grid.innerHTML='';
  const zones = GLOBAL[selectedAirport].zones;
  // sample first two zones for dashboard
  Object.values(zones).slice(0,2).forEach(z=>{
    Object.values(z.spots).slice(0,6).forEach(s=>{
      const el = document.createElement('div'); el.className='slot-card ' + (s.status==='occupied' ? 'booked' : '');
      el.innerHTML = `<div style="font-weight:700">${s.name}</div><div class="small muted">${s.status}</div>`;
      if(s.status==='free') el.onclick = ()=>openBookingModal(s);
      grid.appendChild(el);
    });
  });
}
function renderMapGrid(){
  const canvas = document.getElementById('mapCanvas'); canvas.innerHTML='';
  const zone = GLOBAL[selectedAirport].zones[selectedZoneId];
  if(!zone) { canvas.innerHTML = '<div class="small muted">No zone selected</div>'; return; }
  Object.values(zone.spots).forEach(s=>{
    const el = document.createElement('div'); el.className = 'map-spot ' + (s.status==='free' ? 'free' : 'occupied');
    el.innerText = s.name;
    if(s.status==='free') el.onclick = ()=>openBookingModal(s);
    canvas.appendChild(el);
  });
}
function renderReservations(){
  const rdiv = document.getElementById('reservationsList'); rdiv.innerHTML='';
  const arr = JSON.parse(localStorage.getItem('my_reservations_v1') || '[]');
  if(arr.length===0){ rdiv.innerHTML = '<div class="small muted">No upcoming reservations</div>'; return; }
  arr.forEach(r=>{
    const el = document.createElement('div'); el.className='card'; el.style.marginBottom='8px'; el.innerHTML = `<div style="display:flex;justify-content:space-between"><div><strong>${r.spotName}</strong><div class="small muted">${r.airport} • ${r.zone}</div></div><div style="text-align:right"><div style="font-weight:700">${formatCurrency(airports[r.airport].currency.symbol, r.total)}</div><div class="small muted">${new Date(r.ts).toLocaleString()}</div></div></div>`;
    rdiv.appendChild(el);
  });
}
function renderTransactions(){
  const txDiv = document.getElementById('txList'); txDiv.innerHTML='';
  const txs = JSON.parse(localStorage.getItem('my_payments_v1') || '[]');
  if(txs.length===0){ txDiv.innerHTML = '<div class="small muted">No transactions</div>'; return; }
  txs.slice(0,6).forEach(t=>{
    const el = document.createElement('div'); el.className='card'; el.style.marginBottom='8px'; el.innerHTML = `<div style="display:flex;justify-content:space-between"><div><strong>${t.method}</strong><div class="small muted">${t.id}</div></div><div style="text-align:right">${formatCurrency(t.symbol,t.amount)}</div></div>`;
    txDiv.appendChild(el);
  });
}

/* ------------------------
   Map / zone controls
   ------------------------ */
function openMap(zoneId=null){
  if(zoneId) selectedZoneId = zoneId;
  if(!selectedZoneId) selectedZoneId = Object.keys(GLOBAL[selectedAirport].zones)[0];
  document.getElementById('mapViewCard').style.display='block';
  const zone = GLOBAL[selectedAirport].zones[selectedZoneId];
  document.getElementById('mapTitle').textContent = `${GLOBAL[selectedAirport].airport.name} — ${zone.meta.name}`;
  document.getElementById('mapSubtitle').textContent = `${Object.keys(zone.spots).length} spots`;
  renderMapGrid();
}
function closeMap(){ document.getElementById('mapViewCard').style.display='none'; selectedZoneId = null; }

/* ------------------------
   Booking + Mock Payment flow
   ------------------------ */

function openBookingModal(spot){
  // ensure selectedZoneId is set to the spot's zone
  const zoneKeys = Object.keys(GLOBAL[selectedAirport].zones);
  zoneKeys.forEach(zid => { if(GLOBAL[selectedAirport].zones[zid].spots[spot.id]) selectedZoneId = zid; });

  const ap = airports[selectedAirport];
  const rate = ap.rate;
  const hours = parseInt(document.getElementById('hours').value || 1, 10);
  const total = rate * hours;

  const modalRoot = document.getElementById('modalRoot'); modalRoot.innerHTML = '';
  const mb = document.createElement('div'); mb.className='modal-back';
  mb.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>Reserve ${spot.name}</strong><div class="small muted">${ap.name} • Spot ${spot.id}</div></div>
        <div><button onclick="closeModal()" style="background:none;border:none;font-weight:700;cursor:pointer">✕</button></div>
      </div>
      <div style="height:10px"></div>
      <label class="small muted">Vehicle number</label>
      <input id="vehicleNo" placeholder="KA-01-AB-1234" />
      <div style="height:8px"></div>
      <label class="small muted">Owner name</label>
      <input id="ownerName" placeholder="Your name" />
      <div style="height:8px"></div>
      <div style="display:flex;gap:8px">
        <div style="flex:1">
          <label class="small muted">Hours</label>
          <input id="payHours" type="number" min="1" value="${hours}" />
        </div>
        <div style="width:140px">
          <label class="small muted">Total</label>
          <div style="padding:10px;border-radius:8px;border:1px solid #eef3ff;font-weight:700">${formatCurrency(ap.currency.symbol, total)}</div>
        </div>
      </div>
      <hr style="margin:12px 0" />
      <div style="font-weight:700">Payment (Mock)</div>
      <div style="height:8px"></div>
      <label class="small muted">Card number</label>
      <input id="cardNo" placeholder="4242 4242 4242 4242" />
      <div style="display:flex;gap:8px;margin-top:8px">
        <div style="flex:1"><label class="small muted">Expiry (MM/YY)</label><input id="exp" placeholder="08/26" /></div>
        <div style="width:120px"><label class="small muted">CVV</label><input id="cvv" placeholder="123" /></div>
      </div>
      <div style="height:10px"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="processMockPayment('${spot.id}')">Pay & Reserve</button>
        <button class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
      </div>
    </div>`;
  modalRoot.appendChild(mb);
}

/* Luhn check for basic card validation */
function luhnCheck(num){
  const s = num.replace(/\D/g,'');
  let sum = 0, alt=false;
  for(let i=s.length-1;i>=0;i--){
    let n = parseInt(s[i],10);
    if(alt){ n*=2; if(n>9) n -= 9; }
    sum += n; alt = !alt;
  }
  return (sum % 10) === 0;
}

function processMockPayment(spotId){
  const vehicle = document.getElementById('vehicleNo').value.trim();
  const owner = document.getElementById('ownerName').value.trim();
  const hours = parseInt(document.getElementById('payHours').value || 1, 10);
  const card = document.getElementById('cardNo').value.trim();
  const exp = document.getElementById('exp').value.trim();
  const cvv = document.getElementById('cvv').value.trim();

  if(!vehicle || !owner){ return alert('Please provide vehicle and owner name'); }
  if(!card || !exp || !cvv){ return alert('Please fill card details (mock)'); }
  // basic luhn on digits
  if(!luhnCheck(card)){ if(!confirm('Card number failed basic check. Continue with mock payment?')) return; }

  // disable buttons visually by replacing content with processing UI
  const modalRoot = document.getElementById('modalRoot'); modalRoot.innerHTML = '';
  const processing = document.createElement('div'); processing.className='modal-back';
  processing.innerHTML = `<div class="modal"><div style="text-align:center"><h3>Processing Payment</h3><div class="small muted">Mock processing — no real charge.</div><div style="height:18px"></div><div class="small muted">Please wait…</div></div></div>`;
  modalRoot.appendChild(processing);

  // simulate network delay
  setTimeout(()=>{
    // mark spot occupied
    let bookedSpot = null;
    Object.values(GLOBAL[selectedAirport].zones).forEach(zone=>{
      if(zone.spots[spotId]){ zone.spots[spotId].status = 'occupied'; zone.spots[spotId].lastSeen = Date.now(); bookedSpot = zone.spots[spotId]; }
    });
    GLOBAL[selectedAirport].lastUpdated = Date.now();
    saveState();

    // create reservation
    const ap = airports[selectedAirport];
    const pricePerHour = ap.rate;
    const total = pricePerHour * hours;
    const reservations = JSON.parse(localStorage.getItem('my_reservations_v1') || '[]');
    const reservation = {
      id: 'R' + Math.random().toString(36).slice(2,8).toUpperCase(),
      airport: ap.code, zone: selectedZoneId, spotId: spotId, spotName: bookedSpot ? bookedSpot.name : spotId,
      vehicle, owner, hours, pricePerHour, total, ts: Date.now()
    };
    reservations.unshift(reservation);
    localStorage.setItem('my_reservations_v1', JSON.stringify(reservations));

    // create mock transaction
    const txs = JSON.parse(localStorage.getItem('my_payments_v1') || '[]');
    const tx = {
      id: 'T' + Math.random().toString(36).slice(2,10).toUpperCase(),
      ts: Date.now(),
      method: 'Card (Mock)',
      last4: card.replace(/\D/g,'').slice(-4),
      amount: total,
      symbol: ap.currency.symbol
    };
    txs.unshift(tx);
    localStorage.setItem('my_payments_v1', JSON.stringify(txs));

    // close modal & refresh UI
    closeModal();
    toast('Payment successful — reservation confirmed');
    renderReservations(); renderTransactions(); renderLiveGrid(); renderZones(); if(document.getElementById('mapViewCard').style.display==='block') renderMapGrid();

    // show receipt modal
    showReceipt(reservation, tx);

  }, 1400);
}

function showReceipt(reservation, tx){
  const root = document.getElementById('modalRoot'); root.innerHTML = '';
  const mb = document.createElement('div'); mb.className='modal-back';
  mb.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>Receipt</strong><div class="small muted">${reservation.airport} • ${reservation.spotName}</div></div>
        <div><button onclick="closeModal()" style="background:none;border:none;cursor:pointer;font-weight:700">✕</button></div>
      </div>
      <div style="height:8px"></div>
      <div><strong>Reservation ID:</strong> ${reservation.id}</div>
      <div><strong>Transaction ID:</strong> ${tx.id}</div>
      <div class="small muted">Date: ${new Date(reservation.ts).toLocaleString()}</div>
      <hr style="margin:10px 0" />
      <div><strong>Vehicle:</strong> ${reservation.vehicle}</div>
      <div><strong>Duration:</strong> ${reservation.hours} hrs</div>
      <div><strong>Amount:</strong> ${tx.symbol}${tx.amount.toFixed(2)}</div>
      <div style="height:10px"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="printReceipt()">Print</button>
        <button class="btn" style="background:#999" onclick="closeModal()">Close</button>
      </div>
    </div>`;
  root.appendChild(mb);
}

function printReceipt(){
  // very simple print view
  const reservations = JSON.parse(localStorage.getItem('my_reservations_v1') || '[]');
  const latest = reservations[0];
  if(!latest){ alert('No receipt available'); return; }
  const html = `
    <html><head><title>Receipt</title></head><body>
      <h2>Receipt — ${latest.id}</h2>
      <p><strong>Airport:</strong> ${latest.airport}</p>
      <p><strong>Spot:</strong> ${latest.spotName}</p>
      <p><strong>Vehicle:</strong> ${latest.vehicle}</p>
      <p><strong>Duration:</strong> ${latest.hours} hrs</p>
      <p><strong>Total:</strong> ${latest.pricePerHour} x ${latest.hours} = ${latest.total}</p>
    </body></html>`;
  const w = window.open('', '_blank'); w.document.write(html); w.document.close(); w.print();
}

/* ------------------------
   IoT simulation + helpers
   ------------------------ */
function startIoTSimulation(){
  if(iotInterval) clearInterval(iotInterval);
  iotInterval = setInterval(()=> {
    Object.keys(GLOBAL).forEach(ap=>{
      Object.values(GLOBAL[ap].zones).forEach(z=>{
        Object.values(z.spots).forEach(s=>{
          if(Math.random() < 0.08) s.status = (s.status === 'free') ? 'occupied' : 'free';
        });
      });
      GLOBAL[ap].lastUpdated = Date.now();
    });
    saveState();
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    renderLiveGrid(); renderZones(); if(document.getElementById('mapViewCard').style.display==='block') renderMapGrid();
  }, 3000);
}

/* ------------------------
   Utility & boot
   ------------------------ */
function formatCurrency(sym, amt){ return sym + (typeof amt === 'number' ? amt.toFixed(2) : amt); }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function refreshDashboard(){ updateAirportInfo(); renderZones(); renderLiveGrid(); renderReservations(); renderTransactions(); }
function onAirportChange(){ selectedAirport = document.getElementById('airportSelect').value; updateAirportInfo(); renderZones(); renderLiveGrid(); renderReservations(); renderTransactions(); }
function renderTransactions(){ /* implemented above to show in left card */ renderUnexpected(); }

/* small renderer for txs (kept separate to avoid duplication) */
function renderUnexpected(){ const txDiv = document.getElementById('txList'); txDiv.innerHTML=''; const txs = JSON.parse(localStorage.getItem('my_payments_v1')||'[]'); if(txs.length===0){ txDiv.innerHTML='<div class="small muted">No transactions</div>'; return; } txs.slice(0,6).forEach(t=>{ const el=document.createElement('div'); el.className='card'; el.style.marginBottom='8px'; el.innerHTML = `<div style="display:flex;justify-content:space-between"><div><strong>${t.method}</strong><div class="small muted">${t.id}</div></div><div style="text-align:right">${t.symbol}${t.amount.toFixed(2)}</div></div>`; txDiv.appendChild(el); }); }

/* initial population */
(function init(){
  document.getElementById('date')?.remove?.(); // noop if not present
  populateAirportSelect();
  if(!GLOBAL[selectedAirport]) GLOBAL = createInitialState();
  renderZones(); renderLiveGrid(); renderReservations(); renderUnexpected();
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  startIoTSimulation();
})();

</script>
</body>
</html>
